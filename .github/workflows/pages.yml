name: GitHub Pages

# Сайт https://crucian1812-a11y.github.io/Velo/ публикуется из ветки gh-pages.
# При каждом изменении main ветка gh-pages обновляется до того же состояния.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Обновить gh-pages из main
        run: git push --force origin HEAD:refs/heads/gh-pages
