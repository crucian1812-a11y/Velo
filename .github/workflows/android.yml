name: Android APK

on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'android-app/**'
      - 'audio/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Сборка веб-части и синхронизация Capacitor
        working-directory: android-app
        run: |
          npm ci
          npm run sync

      - name: Сборка APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Переименование APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk velo1-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: velo1-tracker-apk
          path: velo1-tracker.apk

      - name: Публикация в релиз android-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: ${{ github.sha }}
          name: ВЕЛО1 Трекер для Android (последняя сборка)
          body: |
            APK для установки на Android. Скачайте `velo1-tracker.apk` на телефон и откройте файл.
            Сборка из коммита ${{ github.sha }} (ветка ${{ github.ref_name }}).
          prerelease: false
          make_latest: true
          files: velo1-tracker.apk
